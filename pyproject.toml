[project]
name = "rag-langchain-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NaVuLoL", email = "116938967+Navamanidhassan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonpatch>=1.33",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rag-langchain-bot = "rag_langchain_bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
